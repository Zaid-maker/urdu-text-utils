name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # The published bundle must work in both module systems, so both are loaded
      # from the built output rather than from src.
      - name: Smoke test built output
        run: |
          node -e "const u=require('./dist/index.cjs'); if(u.normalizeUrdu('كيا')!=='کیا') throw new Error('cjs bundle broken')"
          node --input-type=module -e "import {normalizeUrdu} from './dist/index.js'; if(normalizeUrdu('كيا')!=='کیا') throw new Error('esm bundle broken')"

      # The docs import the library from source and VitePress fails the build on a
      # dead link, so this catches both broken examples and stale cross-references.
      - name: Build docs
        if: matrix.node == 22
        run: npm run docs:build

  # The PHP port consumes tables and fixtures generated from the TypeScript
  # source. Regenerating both and failing on any diff catches committed drift
  # (a table edit that forgot to run the generators), then the PHPUnit suite
  # proves the port still matches the freshly generated fixtures.
  php-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          # mbstring is required by PHPUnit; intl exercises the true-NFKC path
          # (locally the generated presentation-form fallback is what runs).
          extensions: mbstring, intl

      - run: npm ci
      # The fixture generator runs the real TS implementation from dist.
      - run: npm run build

      - name: Check PHP tables and fixtures are in sync with the TS source
        run: |
          node scripts/generate-php-tables.mjs
          node scripts/generate-php-fixtures.mjs
          if [ -n "$(git status --porcelain -- php/)" ]; then
            echo "php/data or php/tests/fixtures drifted from the TypeScript source."
            echo "Regenerate from the repo root and commit the result:"
            echo "  node scripts/generate-php-tables.mjs"
            echo "  node scripts/generate-php-fixtures.mjs"
            git diff --stat -- php/
            exit 1
          fi

      - name: Run the PHP parity suite
        working-directory: php
        run: |
          composer install --no-interaction --prefer-dist
          vendor/bin/phpunit

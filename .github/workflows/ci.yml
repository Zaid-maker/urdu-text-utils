name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # The published bundle must work in both module systems, so both are loaded
      # from the built output rather than from src.
      - name: Smoke test built output
        run: |
          node -e "const u=require('./dist/index.cjs'); if(u.normalizeUrdu('كيا')!=='کیا') throw new Error('cjs bundle broken')"
          node --input-type=module -e "import {normalizeUrdu} from './dist/index.js'; if(normalizeUrdu('كيا')!=='کیا') throw new Error('esm bundle broken')"

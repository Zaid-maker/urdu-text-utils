name: Pre-release

# Triggered by pre-release version tags:
#   v1.2.3-alpha.1    → published to npm with --tag alpha
#   v1.2.3-beta.1     → published to npm with --tag beta
#   v1.2.3-rc.1       → published to npm with --tag next
#
# GitHub Release is created as a pre-release (not visible as "Latest").
# npm dist-tag means users only get the pre-release if they run:
#   npm install urdu-text-utils@beta
#   npm install urdu-text-utils@alpha
#   npm install urdu-text-utils@next
#
# Authentication is npm Trusted Publishing (OIDC) — no npm token needed.
# If this file is renamed, update the trusted publisher config on npm first.
on:
  push:
    # Matches pre-release tags: v1.2.3-alpha.1, v1.2.3-beta.2, v1.2.3-rc.1
    tags: ["v*-*"]

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm provenance attestation (OIDC)

jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # OIDC publishing needs npm 11.5.1+; the npm bundled with Node 22 is 10.x.
      - run: npm install -g npm@latest

      - run: npm ci

      # Verify the git tag matches the version in package.json.
      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi
          echo "Publishing pre-release version $PKG"

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Derive the npm dist-tag from the pre-release identifier:
      #   v1.2.3-alpha.1  → --tag alpha
      #   v1.2.3-beta.2   → --tag beta
      #   v1.2.3-rc.1     → --tag next   (rc maps to "next" per npm convention)
      - name: Derive npm dist-tag
        id: dist_tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PRERELEASE_ID=$(echo "$VERSION" | grep -oP '(?<=-)[a-zA-Z]+')
          case "$PRERELEASE_ID" in
            alpha)  TAG="alpha" ;;
            beta)   TAG="beta" ;;
            rc)     TAG="next" ;;
            *)      TAG="next" ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved npm dist-tag: $TAG"

      # Publish with the derived dist-tag and OIDC provenance.
      - name: Publish pre-release to npm
        run: npm publish --access public --tag ${{ steps.dist_tag.outputs.tag }}

      # Extract the matching version block from CHANGELOG.md.
      - name: Extract release notes from CHANGELOG.md
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk "/^## ${VERSION}$/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            # Fall back to a generic message if no CHANGELOG entry exists yet
            NOTES="Pre-release \`${GITHUB_REF_NAME}\`. Install with:
          \`\`\`
          npm install urdu-text-utils@${{ steps.dist_tag.outputs.tag }}
          \`\`\`"
          fi
          echo "$NOTES" > /tmp/release_notes.md
          echo "Release notes for ${VERSION}:"
          cat /tmp/release_notes.md

      # Create a GitHub Release marked as pre-release.
      - name: Create GitHub Pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME (pre-release)" \
            --notes-file /tmp/release_notes.md \
            --prerelease \
            --verify-tag

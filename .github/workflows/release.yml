name: Release

# Publishing is driven by tags: push a `v1.2.3` tag and this workflow publishes
# that exact version to npm with a provenance attestation, then opens a GitHub
# Release. Nothing publishes on an ordinary push to main.
#
# Authentication is npm Trusted Publishing (OIDC) — there is no npm token in this
# repo. npm trusts this exact repo + workflow filename, so the trust breaks if this
# file is renamed; update the trusted publisher on npm first if it ever moves.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm provenance attestation (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # OIDC publishing needs npm 11.5.1+; the npm bundled with Node 22 is 10.x.
      - run: npm install -g npm@latest

      - run: npm ci

      # A tag that disagrees with package.json would publish a surprising version,
      # so fail loudly before anything reaches the registry.
      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi
          echo "Publishing version $PKG"

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # No NODE_AUTH_TOKEN: the OIDC id-token above is the credential, and npm
      # attaches provenance automatically for a trusted publisher.
      - name: Publish to npm
        run: npm publish --access public

      - name: Extract release notes from CHANGELOG.md
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Extract the block between "## $VERSION" and the next "## " heading
          NOTES=$(awk "/^## ${VERSION}$/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)
          # Write to a temp file to safely handle multiline content
          echo "$NOTES" > /tmp/release_notes.md
          echo "Release notes extracted for v${VERSION}"
          cat /tmp/release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/release_notes.md \
            --verify-tag

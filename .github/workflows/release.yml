name: Release

# Handles both stable (v1.2.3) and pre-release (v1.2.3-alpha.1) tags.
# Authentication is npm Trusted Publishing (OIDC) via release.yml.
on:
  push:
    # Matches any version tag: v1.2.3, v1.2.3-alpha.1, v1.2.3-beta.2, v1.2.3-rc.1
    tags: ["v*.*.*"]

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm provenance attestation (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # OIDC publishing needs npm 11.5.1+; the npm bundled with Node 22 is 10.x.
      - run: npm install -g npm@latest

      - run: npm ci

      # A tag that disagrees with package.json would publish a surprising version,
      # so fail loudly before anything reaches the registry.
      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi
          echo "Publishing version $PKG"

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Derive the npm dist-tag from the version:
      #   v1.2.3           → no tag (latest)
      #   v1.2.3-alpha.1   → --tag alpha
      #   v1.2.3-beta.2    → --tag beta
      #   v1.2.3-rc.1      → --tag next
      - name: Derive npm dist-tag
        id: dist_tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if echo "$VERSION" | grep -qP '-'; then
            # Pre-release: extract the identifier before the dot-separated number
            PRERELEASE_ID=$(echo "$VERSION" | grep -oP '(?<=-)[a-zA-Z]+')
            case "$PRERELEASE_ID" in
              alpha)  TAG="alpha" ;;
              beta)   TAG="beta" ;;
              rc)     TAG="next" ;;
              *)      TAG="next" ;;
            esac
          else
            TAG=""
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved npm dist-tag: ${TAG:-latest}"

      # No NODE_AUTH_TOKEN: the OIDC id-token above is the credential, and npm
      # attaches provenance automatically for a trusted publisher.
      - name: Publish to npm
        run: |
          if [ -n "${{ steps.dist_tag.outputs.tag }}" ]; then
            npm publish --access public --tag ${{ steps.dist_tag.outputs.tag }}
          else
            npm publish --access public
          fi

      - name: Extract release notes from CHANGELOG.md
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk "/^## ${VERSION}$/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="Pre-release \`${GITHUB_REF_NAME}\`. Install with:
          \`\`\`
          npm install urdu-text-utils@${{ steps.dist_tag.outputs.tag || 'latest' }}
          \`\`\`"
          fi
          echo "$NOTES" > /tmp/release_notes.md
          echo "Release notes extracted for v${VERSION}"
          cat /tmp/release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAGS=""
          # Mark pre-releases as pre-release on GitHub
          if echo "$GITHUB_REF_NAME" | grep -q '-'; then
            FLAGS="--prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/release_notes.md \
            --verify-tag \
            $FLAGS
